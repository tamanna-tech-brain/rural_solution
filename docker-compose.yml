version: "3.9"

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: krishipool_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: krishipool
    volumes:
      - mongo_data:/data/db
    networks:
      - krishipool_net

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      target: production
    container_name: krishipool_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/krishipool
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - krishipool_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: krishipool_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - krishipool_net

volumes:
  mongo_data:
  backend_uploads:

networks:
  krishipool_net:
    driver: bridge
